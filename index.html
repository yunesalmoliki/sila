<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>صِلة</title>
  <meta name="theme-color" content="#F3ECDD" />
  <meta name="description" content="يذكّرك بمن طال غيابه من أهلك وأصدقائك، ويجهّز لك رسالة تفتح واتساب لترسلها بنفسك." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-root"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__silaInstallPrompt = e;
    });
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // فشل تسجيل الـ Service Worker لا يعطّل التطبيق، فقط يفقد ميزة العمل بلا إنترنت
        });
      });
    }
  </script>
</body>
</html>
