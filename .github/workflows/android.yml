name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir www
          cp -r index.html get.html css js icons manifest.json www/

      - run: npm install

      - name: Contacts plugin - ask for read permission only
        run: |
          F=node_modules/@capacitor-community/contacts/android/src/main/java/getcapacitor/community/contacts/ContactsPlugin.java
          sed -i 's/Manifest.permission.READ_CONTACTS, Manifest.permission.WRITE_CONTACTS/Manifest.permission.READ_CONTACTS/' "$F"
          grep -n "permissions = " "$F"
          grep -q "WRITE_CONTACTS" "$F" && exit 1 || true

      - run: npx cap add android

      - name: Contacts permission
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perm = '    <uses-permission android:name="android.permission.READ_CONTACTS" />\n'
          queries = '    <queries>
        <package android:name="com.whatsapp" />
        <package android:name="com.whatsapp.w4b" />
    </queries>
'
          if 'READ_CONTACTS' not in s:
              s = s.replace('</manifest>', perm + queries + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: WhatsApp chooser plugin
        run: |
          D=android/app/src/main/java/com/yunesalmoliki/sila
          mkdir -p "$D"
          cat > "$D/WaLauncherPlugin.java" <<'EOF'
          package com.yunesalmoliki.sila;

          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "WaLauncher")
          public class WaLauncherPlugin extends Plugin {
              private boolean isInstalled(String pkg) {
                  try {
                      getContext().getPackageManager().getPackageInfo(pkg, 0);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              @PluginMethod
              public void installed(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("whatsapp", isInstalled("com.whatsapp"));
                  r.put("business", isInstalled("com.whatsapp.w4b"));
                  call.resolve(r);
              }

              @PluginMethod
              public void open(PluginCall call) {
                  String pkg = call.getString("package");
                  String url = call.getString("url");
                  if (url == null || !url.startsWith("https://wa.me/")
                      || !("com.whatsapp".equals(pkg) || "com.whatsapp.w4b".equals(pkg))) {
                      call.reject("invalid");
                      return;
                  }
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      i.setPackage(pkg);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          EOF
          cat > "$D/MainActivity.java" <<'EOF'
          package com.yunesalmoliki.sila;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(WaLauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Launcher icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#F3ECDD' --iconBackgroundColorDark '#F3ECDD'

      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > sila.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks sila.p12 --ks-pass env:KS_PASS --ks-key-alias sila --out sila.apk aligned.apk
          "$BT/apksigner" verify --print-certs sila.apk
          rm -f sila.p12

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sila.apk --clobber
          else
            gh release create "$TAG" sila.apk --title "صِلة $TAG" --notes "نسخة أندرويد مستقلة من صِلة. حمّل sila.apk وثبّته (اسمح بالتثبيت من هذا المصدر إن طُلب)." --latest
          fi
